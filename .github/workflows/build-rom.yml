name: Compilar Distro Tab 2 (GT-P3110)

# Permite disparar a compilação manualmente clicando em um botão no GitHub
on:
  workflow_dispatch:

jobs:
  build:
    # Solicita ao GitHub uma VM Ubuntu na nuvem
    runs-on: ubuntu-22.04

    steps:
      # 1. Clona o seu repositório com suas personalizações para dentro da VM
      - name: Baixar configurações da minha distro
        uses: actions/checkout@v4

      # 2. Libera ~25 GB no disco virtual da VM removendo SDKs que não usaremos
      - name: Liberar espaço em disco na VM
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      # 3. Cria 12 GB de Swap na VM para o compilador Java (Jack) não estourar os 16 GB de RAM
      - name: Configurar Swap na VM
        run: |
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # 4. Sobe um contêiner Ubuntu 18.04 dentro da VM (com Python 2.7 e OpenJDK 8 prontos)
      # e executa todo o ciclo de sincronização, personalização e compilação
      - name: Sincronizar e Compilar ROM no Ubuntu 18.04
        run: |
          mkdir -p $HOME/rom
          cp -r manifests overlays prebuilt $HOME/rom/

          docker run --rm -v $HOME/rom:/build ubuntu:18.04 bash -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update && apt-get install -y \
              bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
              git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
              lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
              libwxgtk3.0-dev libxml2 libxml2-utils lzop openjdk-8-jdk pngcrush \
              python python3 rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

            # Instala a ferramenta repo do Google
            curl -s https://storage.googleapis.com/git-repo-downloads/repo > /usr/local/bin/repo
            chmod a+x /usr/local/bin/repo

            git config --global user.name "Builder"
            git config --global user.email "builder@github.com"

            cd /build
            # Inicializa apenas o último commit (--depth=1) para economizar espaço
            repo init -u https://github.com/LineageOS/android.git -b cm-13.0 --depth=1
            mkdir -p .repo/local_manifests
            cp manifests/espressowifi.xml .repo/local_manifests/

            # Baixa o código-fonte usando 8 conexões simultâneas
            repo sync -c -j8 --force-sync --no-clone-bundle --no-tags

            # Remove o histórico oculto do Git (.repo) após baixar para liberar ~28 GB antes de compilar
            rm -rf .repo

            # Aplica o seu script de corte de apps e ajustes de baixa RAM
            bash overlays/debloat.sh

            # Inicia a compilação para o GT-P3110
            export EXPERIMENTAL_USE_JAVA8=true
            source build/envsetup.sh
            breakfast espressowifi
            mka bacon
          '

      # 5. Salva o .zip gerado como Artifact para você baixar direto no Mi Pad 6
      - name: Publicar ROM compilada (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: MinhaDistro-GT-P3110
          path: ~/rom/out/target/product/espressowifi/cm-13.0-*.zip
          retention-days: 7
